name: pdfhawk
description: "PDF Hawk - A fast, modern PDF reader, editor, document converter, and scanner app."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.1.0+2

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  path_provider: ^2.1.3
  pdfx: ^2.6.0
  pdf: ^3.10.8
  saf: ^1.0.4
  pdf_render_plus: ^1.4.1
  shared_preferences: ^2.2.3
  file_picker: ^8.0.3
  path: ^1.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  gap: ^3.0.1
  community_material_icon: ^5.9.55
  camera: ^0.10.5+9
  image: ^4.2.0
  sensors_plus: ^7.1.0
  archive: ^3.6.1
  flutter_quill: ^11.5.1
  modal_bottom_sheet: ^3.0.0
  intl: ^0.20.2
  fluttertoast: ^9.1.0
  flutter_reorderable_grid_view: ^5.7.0
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  tutorial_coach_mark: ^1.3.3
  permission_handler: 11.3.1
  flutter_image_filters: ^0.0.32
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  syncfusion_flutter_pdf: ^33.2.13
  flutter_svg: ^2.3.0

dependency_overrides:
  permission_handler_android: 12.0.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/src/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/src/logo.png"
  adaptive_icon_monochrome: "assets/src/logo_mono.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/src/logo.png
  color_dark: "#000000"
  image_dark: assets/src/logo_mono.png
  android_12:
    image: assets/src/logo.png
    color: "#ffffff"
    image_dark: assets/src/logo_mono.png
    color_dark: "#000000"
  android: true
  ios: false
  android_gravity: center
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/src/
    - assets/illustration/
  fonts:
    - family:  PDFHawkIcons
      fonts:
       - asset: assets/fonts/PDFHawkIcons.ttf